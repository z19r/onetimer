# Visitor counter — triggered by github-counter pixel server via
# repository_dispatch (event_type: pixel_hit).
#
# Requires README.md to contain:
#   <!--COUNTER:START-->0<!--COUNTER:END-->

name: Increment Counter

on:
  repository_dispatch:
    types: [pixel_hit]

permissions:
  contents: write

jobs:
  increment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Increment counter in README
        run: |
          set -euo pipefail
          CURRENT=$(grep -oP \
            '(?<=<!--COUNTER:START-->)\d+(?=<!--COUNTER:END-->)' \
            README.md)
          NEW=$((CURRENT + 1))
          OLD="<!--COUNTER:START-->${CURRENT}<!--COUNTER:END-->"
          NEW_MARK="<!--COUNTER:START-->${NEW}<!--COUNTER:END-->"
          sed -i "s/${OLD}/${NEW_MARK}/" README.md

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && exit 0
          git commit -m "Increment visitor counter"
          git push
